name: Sponsor goal badge

# Keeps .github/badges/sponsor-goal.json in sync with the public GitHub Sponsors goal,
# so README badges across all 99proteam projects show live progress.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sponsor-goal
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/scripts/sponsor-goal.mjs
      - name: Commit if the progress changed
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update sponsor goal badge [skip ci]"
          git push
