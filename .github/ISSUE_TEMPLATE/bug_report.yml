name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SelfDeploy version
      description: "Output of: docker exec selfdeploy selfdeploy version"
  - type: input
    id: os
    attributes:
      label: Server OS and Docker version
      placeholder: Ubuntu 24.04, Docker 29.0
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Build log or "docker logs selfdeploy" output. Remove secrets first.
      render: text
